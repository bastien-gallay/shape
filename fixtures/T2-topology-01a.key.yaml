# ⚠️ A/B pair. `01a` and `01b` are the same content in two forms, and differ
# in nothing else — the diff is confined to one section. They exist to answer
# the open question in references/calibration.md: does locate cost separate the
# graph from the table where retrieval accuracy does not? Score both arms with
# the same frozen questions, in cold subagents, k = 3, and compare *blocks
# opened* as well as *answers correct*.
# 🛑 Neither arm is evidence on its own. Reporting one without the other
# reintroduces exactly the form-blindness this pair measures.
ab_pair: [T2-topology-01a, T2-topology-01b]

# 📌 Hand-authored, once, and frozen. `hops` is the number of dependency edges
# the answer requires — it is the axis the A/B pair exists to test, so it is
# recorded per question rather than inferred later.
questions:
  - q: Which service does `web-console` depend on directly?
    a: api-edge
    hops: 1
  - q: How many services must be healthy before `ledger-writer` can write, and which?
    a: two — queue-broker and object-store
    hops: 1
  - q: Which services depend on nothing at all?
    a: token-cache and object-store
    hops: 1
  - q: Which service is depended on by the most others, and by how many?
    a: object-store, by three — queue-broker, ledger-writer, report-builder
    hops: 1
  - q: If `object-store` is unavailable, which services can still serve?
    a: token-cache and auth-gateway only
    hops: 3
  - q: Which services does nothing else depend on?
    a: web-console, ledger-writer and report-builder
    hops: 2
  - q: What is the longest dependency chain starting at `web-console`?
    a: three hops — web-console → api-edge → queue-broker → object-store
    hops: 3
  - q: Restarting `auth-gateway` interrupts which services?
    a: api-edge and report-builder directly, web-console transitively
    hops: 2

must_preserve:
  - "orchard-ledger-replay"
  - "The only writer of the billing ledger."
  - "a missed billing event is not recoverable by replay"
