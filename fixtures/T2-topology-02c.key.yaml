# ⚠️ A/B/C triple, scored as a triple. 20 services, 30 edges, and the three arms
# differ in exactly one section — `## Service dependencies` — plus the per-entry
# `Calls:` line that exists only in arm a. Everything else is byte-identical.
#
# ⭐ Two variables, deliberately separated, which the 01 pair confounded:
#   a → b  consolidation. Are the edges in one place, or spread over 20 entries?
#   b → c  form.          Is the consolidated topology a table, or a graph?
# 🛑 No arm is evidence on its own. b alone repeats the 01 measurement at size;
# a alone measures scattering with nothing to scatter against.
#
# 📌 Why this fixture exists. The 01 pair was 538 words with 9 edges, and both
# arms scored 24/24 with the same blocks opened. Two explanations survived that
# result and it could not tell them apart: either the retrieval loop cannot
# grade form, or the document was too small for form to cost anything. This one
# has 30 edges, six of the ten questions need a reverse edge or a path, and no
# section restates the topology in prose.
#
# ⚠️ A defect found in 01 while writing this: its `Deploy order` and `On call`
# sections restate the topology — "object-store and token-cache — no
# dependencies" answers question 3 outright. That is a third live explanation
# for the 01 null result, and it is not reproduced here. Deploy order states the
# rule and not the sequence; On call names ownership and not dependencies; no
# failure mode names a path.
abc_triple: [T2-topology-02a, T2-topology-02b, T2-topology-02c]

# 📌 Hand-authored, once, frozen, and each answer re-derived from the arm-b
# table by script rather than by eye. `hops` is the number of edges the answer
# needs; a reverse-edge question is the expensive one and there are four.
questions:
  - q: Which services does `tariff-api` call directly?
    a: rate-engine and object-vault
    hops: 1
  - q: Which services call `event-bus` directly?
    a: six — booking-api, customs-relay, ledger-writer, manifest-api, notify-fanout, slot-planner
    hops: 1
  - q: Which services call nothing at all?
    a: event-bus, object-vault, pg-primary and session-cache
    hops: 1
  - q: Which services are called by nothing at all?
    a: agent-console, dock-portal, invoice-render and notify-fanout
    hops: 1
  - q: What is the shortest chain from `gateway-api` to `pg-primary`?
    a: two hops — gateway-api → booking-api → pg-primary
    hops: 2
  - q: Can `dock-portal` reach `object-vault`, and by what path?
    a: yes, in three hops — dock-portal → gateway-api → tariff-api → object-vault
    hops: 3
  - q: Which services can `dock-portal` not reach at all?
    a: seven — agent-console, customs-relay, invoice-render, ledger-writer, manifest-api, notify-fanout, template-store
    hops: 4
  - q: If `object-vault` is unavailable, which services are directly affected?
    a: invoice-render, ledger-writer, manifest-api, tariff-api and template-store
    hops: 1
  - q: Removing which single service would leave `notify-fanout` unable to reach `object-vault`?
    a: template-store
    hops: 2
  - q: What is the longest dependency chain starting at `dock-portal`?
    a: five hops — dock-portal → gateway-api → booking-api → slot-planner → berth-registry → pg-primary
    hops: 5

