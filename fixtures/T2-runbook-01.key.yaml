# 📌 Why this fixture exists. The corpus was five documents and all five were
# `locate`, so the `execute` ruleset had never been exercised against anything.
# The defects here are planted one per acceptance question in
# `references/tasks/execute.md`, so a `diagnose` run that misses one names the
# question it failed rather than "the document is fine".
#
# ⚠️ It is a single document, not an A/B arm. Nothing here measures form; it
# measures whether `diagnose` finds what its own ruleset says to find. Scoring
# it against the retrieval questions is a second, independent use of the same
# document and the two must not be reported as one result.
#
# ⚠️ The questions are hand-authored by the same author who planted the
# defects, which is the tautology risk recorded against the `02` triple: the
# author chooses both what is hidden and what is asked. It bites less here than
# in topology — Q1, Q3 and Q5 ask about defects that a correct procedure would
# not have, so a repaired document answers them *better*, which is the
# direction the protocol wants. But a null result on this fixture is not
# evidence that the ruleset is sound.

# The planted defects, one per acceptance question of `execute.md`.
planted:
  - question: 1  # one action per step
    where: "### 2. Generate the key and the signing request"
    what: two actions in one step — generate the key, then produce the CSR
  - question: 2  # condition before action
    where: "### 8. Restart the fleet"
    what: "\"Restart the `edge-east` fleet if the staging probe … came back green\" — the reader who acts on the first half has already restarted it"
  - question: 3  # prerequisites reachable before step 1
    where: "### 6. Install on `edge-west`"
    what: the vault token scoped to `edge-ops` is announced here, with a ten-minute wait, and is absent from `## Before you start`
  - question: 4  # commands byte-identical
    where: "### 3. Submit the signing request"
    what: no expected result, so there is nothing to check the step against
  - question: null
    where: "### 4. Wait for issuance and download the chain"
    what: narrative mood — "We then wait" — where every other step is imperative
  - question: null
    where: "### 1. Open the change window"
    what: the rationale for the one-hour window sits inside the step instead of in a note after it

# 📌 Hand-authored, once, frozen. Q5 has no answer in the document by
# construction — it is the planted missing expected-result, and a Reader that
# invents one has failed it. Offer `INSUFFICIENT` as an allowed answer.
questions:
  - q: What must be true before you can start the rotation?
    a: shell access to the bastion host, membership of `edge-ops`, and the work must run from the bastion because the certificate authority only accepts its source address — ⚠️ a vault token scoped to `edge-ops` is also required but is not stated here
  - q: Which command produces the signing request?
    a: "openssl req -new -key edge-2026.key -out edge-2026.csr -subj \"/CN=edge.example.net\""
  - q: Under what condition is the `edge-east` fleet restarted?
    a: only if the staging probe run against `edge-west` came back green
  - q: Which cluster is rotated first, and why are they not rotated together?
    a: "`edge-west` first, so that a bad certificate never takes both clusters out at once"
  - q: What is the expected result of step 3?
    a: INSUFFICIENT — the document states none
  - q: How do you roll back `edge-west`?
    a: read the previous certificate from `secret/edge/west/prev`, write it back to `secret/edge/west`, then `edgectl reload --cluster edge-west`
  - q: How long does the previous certificate remain available?
    a: thirty days
  - q: What happens to a signing request submitted at 02:15?
    a: it appears to succeed and never issues — the portal is in maintenance; wait rather than resubmit, because a duplicate request has to be revoked by hand and revocation takes a working day
  - q: Why must the OCSP staple check not be skipped?
    a: a chain that verifies locally but carries no staple is served by the gateway and rejected by clients that enforce stapling, including the two largest integrators; the failure presents as an outage on their side
  - q: How long should the change window be, and why?
    a: an hour rather than forty minutes, because the certificate authority has occasionally taken longer and a window closing mid-rotation forces a second announcement

# ⛔ Commands are protected verbatim by `execute.md`, and both warnings and the
# rollback are on its forbidden-removal list.
must_preserve:
  - "edgectl reload --cluster edge-west"
  - "Do not skip the staple check."
  - "Rolling back does not shorten the change window."
  - "vault kv get -field=cert secret/edge/west/prev > rollback.pem"
