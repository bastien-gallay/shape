tier: 2
task: execute
audience: dev-doc
form: numbered-steps
modes: [diagnose, restructure]
defect: >-
  a procedure with the four defects `execute.md` names: a step carrying two actions, a conditional step whose action precedes its condition, a prerequisite that only surfaces at the step that needs it, and a step with no expected result. Rationale sits inside steps rather than after them, and one step is narrative rather than imperative.
expect: change

frozen_at: 2026-09-01
