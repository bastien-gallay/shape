id: T2-adr-01
tier: 2
task: decide
audience: dev-doc
form: prose
modes: [diagnose, restructure]
defect: >-
  four options that share criteria are given as four prose paragraphs, so no criterion can be compared across them without reading all four. The recommendation is unmarked and sits under a heading that does not name it. One rejected option is dismissed without a reason. The decision date and its authors are the last line of the document.
expect: change

frozen_at: 2026-09-01
document_sha256: "2999fa57bb86a54f2444ca41123411a5285132101938a3b5f7418e59fd69f4c1"

# 📌 Why this fixture exists. It is the `decide` half of the corpus widening —
# see `T2-runbook-01` for the `execute` half. The defects are planted one per
# acceptance question in `references/tasks/decide.md`.
#
# ⭐ The reason `decide` is the more useful of the two: its ruleset is the one
# with a forbidden transform that a plausible improvement would violate. The
# obvious repair here is an option table, and the obvious way to make an option
# table tidy is to drop the option that was dismissed in half a sentence.
# `decide.md` forbids exactly that — "a future reader arrives holding that
# option and needs to recognise it as already considered". Q5 is the trap: a
# repaired document must still answer it, and must still answer it with
# INSUFFICIENT rather than with an invented reason.
#
# ⚠️ Same tautology caveat as `T2-runbook-01`: one author chose both what is
# hidden and what is asked.

# The planted defects, one per acceptance question of `decide.md`.
planted:
  - question: 1  # one row per option, rejected ones included
    where: "## What we looked at"
    what: four options as four prose paragraphs, in no consistent order, with no row for any of them
  - question: 2  # same criteria across every option
    where: "## What we looked at"
    what: "operational burden, cost, durability, coupling and duplicate-safety are each raised for some options and not others; only the Postgres and managed options are compared on more than one axis"
  - question: 3  # recommendation marked and attributed
    where: "## What we are doing"
    what: the recommendation carries no ⭐, and the attribution is the last line of the document rather than beside the decision
  - question: 4  # hedges survive at strength
    where: "## What we are doing"
    what: "\"We will probably go with the Postgres queue\" — a hedge that a table cell reading \"Postgres queue\" would silently strengthen to a commitment"
  - question: null
    where: "## What we looked at, first paragraph"
    what: "⛔ the cron-and-table option is dismissed with \"We did not pursue it\" and no reason — the defect is the missing why, and deleting the option to tidy the table is the forbidden repair"

# 📌 Hand-authored, once, frozen. Q5 has no answer in the document by
# construction. Offer `INSUFFICIENT` as an allowed answer.
questions:
  - q: Which options were considered?
    a: four — keeping the cron-and-table approach, a managed cloud queue, Redis streams, and a Postgres queue using `SELECT ... FOR UPDATE SKIP LOCKED`
  - q: Which option was chosen?
    a: the Postgres queue
  - q: How firmly is that choice stated?
    a: hedged — "We will probably go with the Postgres queue", not a commitment
  - q: Why was Redis streams rejected?
    a: durability — the existing Redis runs cache semantics with no append-only file and a failover loses memory; fixing it means either changing the session cache settings or running a second Redis, which removes the "we already run it" argument; a four-hour burst would also exceed the instance memory
  - q: Why was the cron-and-table approach rejected?
    a: INSUFFICIENT — the document says "We did not pursue it" and gives no reason
  - q: What was the managed queue estimated to cost?
    a: around two hundred and forty euros a month, at nine thousand batches a day and the current retry rate
  - q: Who decided, and when?
    a: the ingest pair, on 2026-05-14
  - q: What would make the team revisit this decision?
    a: database load — if ingest volume grows another five times, the queue traffic stops being small next to the ingest writes
  - q: If they revisit it, which option do they expect to move to?
    a: the managed queue, not Redis, because the durability objection to Redis does not go away with scale
  - q: What decided it between the two options taken seriously?
    a: not throughput but duplicates — the pointer-based prototype produced twelve duplicate rows over the replay against none for the transactional one

# ⛔ `decide.md` forbids deleting a rejected option, strengthening a hedge, and
# dropping the date or the author.
must_preserve:
  - "We did not pursue it."
  - "We will probably go with the Postgres queue."
  - "Decided 2026-05-14 by the ingest pair"
  - "around two hundred and forty euros a month"
